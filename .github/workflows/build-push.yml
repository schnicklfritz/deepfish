name: Build and Push to Docker Hub

on:
  push:
    branches: ["**"]            # Triggers on every push and commit to ANY branch
  workflow_dispatch:            # Allows you to manually click "Run workflow" in GitHub

# Cancel in-flight runs when new commits land on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sets up the build environment inside the GitHub Action runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # IMPORTANT: Change 'deepfish' to whatever you want the image to be named!
          images: ${{ secrets.DOCKERHUB_USERNAME }}/deepfish
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # Builds locally on GitHub, then pushes the finished image to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64     # QuickPod GPU pods use standard amd64 processors
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha       # Uses GitHub Actions cache to speed up your builds
          cache-to: type=gha,mode=max
          provenance: false
