name: build-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:        # manual trigger from the Actions tab

# Cancel in-flight runs when new commits land on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: schnicklfritz/deepfish

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # only matters if you later switch to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # latest on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # short SHA on every push (for pinning a specific build)
            type=sha,format=short
            # semver tags when you push v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64     # QuickPod GPU pods are amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false          # smaller manifest; flip on if you want SLSA
